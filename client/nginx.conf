server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve upstream at request time so nginx
    # doesn't fail at startup if the API container isn't up yet.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $api_upstream http://server:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE: no buffering, keep the stream alive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
